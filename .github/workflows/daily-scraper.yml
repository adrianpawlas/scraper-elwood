name: Elwood Daily Scraper

on:
  schedule:
    - cron: '0 8 * * *'   # Every day at 8:00 UTC (am)
  workflow_dispatch:        # Manual trigger from the GitHub Actions UI
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'Manual trigger'

jobs:
  scrape:
    name: Scrape & embed Elwood products
    runs-on: ubuntu-latest
    timeout-minutes: 180   # SigLIP download (~1.8 GB) + embedding 100+ products

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ── Cache pip packages ──────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Cache HuggingFace model (saves ~1.8 GB download on repeated runs) ──
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-siglip-base-patch16-384-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py

      # ── Always upload the log so you can inspect results ───────────────────
      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_number }}-${{ github.run_id }}
          path: scraper.log
          retention-days: 30
